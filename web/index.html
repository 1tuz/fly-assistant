<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Assistant - 3D Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="panel-toggle" type="button" aria-label="Hide controls" aria-controls="info">Hide panel</button>
    <div id="info">
        <h1>🪰 Fly Assistant</h1>
        <div id="status">Connecting...</div>
        <div id="task-state" aria-live="polite">Waiting for simulation state</div>
        <div id="camera-controls">
            <button id="camera-reset" type="button">Reset camera</button>
            <button id="camera-follow" type="button" aria-pressed="false">Follow fly: off</button>
        </div>
        <div id="operation-controls">
            <label for="sim-mode">Mode</label>
            <select id="sim-mode">
                <option value="autonomous">Sort misfiled books</option>
                <option value="train">Train fly</option>
                <option value="replay">Replay trained policy</option>
            </select>
            <button id="sim-start" type="button">Start</button>
            <button id="sim-stop" type="button">Stop</button>
            <button id="sim-reset" type="button">Reset</button>
            <div id="training-progress">Training idle</div>
        </div>
        <div id="metrics">
            <div>Target Shelf: <span id="target">-</span></div>
            <div>Books sorted: <span id="inventory-progress">0 / 4</span></div>
            <div>Steps: <span id="steps">-</span></div>
            <div>Brain Activity: <span id="brain_activity">-</span> neurons</div>
            <div>Motor Forward: <span id="motor_fwd">-</span> Hz</div>
            <div>Motor Turn L: <span id="motor_turn_l">-</span> Hz</div>
            <div>Motor Turn R: <span id="motor_turn_r">-</span> Hz</div>
        </div>
        <div id="file-metadata" style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; font-size: 12px;">
            <div style="font-weight: 600; margin-bottom: 4px;">🏷️ Selected File</div>
            <div>Name: <span id="meta-name">Select an item</span></div>
            <div>Size: <span id="meta-size">—</span></div>
            <div>Tag: <span id="meta-tag" style="color: #4af;">—</span></div>
            <div>State: <span id="meta-state">—</span></div>
        </div>
    </div>
    
    <div id="container"></div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.min.js",
            "three/addons/loaders/GLTFLoader.js": "./vendor/three-addons/GLTFLoader.js"
        }
    }
    </script>
    
    <script>
        const showScriptError = message => {
            const status = document.getElementById('status');
            status.textContent = `Scene error: ${message}`;
            status.className = 'error';
        };
        window.addEventListener('error', event => showScriptError(event.message || event.target?.src || 'module load failed'));
        window.addEventListener('unhandledrejection', event => showScriptError(event.reason?.message || String(event.reason)));
    </script>
    <script type="module" src="scene.js"></script>
</body>
</html>
